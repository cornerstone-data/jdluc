[project]
name = "jdluc"
version = "0.1.0"
description = "Cornerstone jdLUC: high-resolution jurisdictional direct LUC methodology, and pipeline for US row crops."
readme = "README.md"
requires-python = ">=3.14,<3.15"

dependencies = [
    "GitPython",
    "dask",
    "gcsfs",
    "geopandas",
    "google-cloud-storage",
    "netCDF4",
    "networkx",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "requests",
    "rio-cogeo",
    "rioxarray",
    "xarray",
    "zarr",
]

[dependency-groups]
dev = [
    "mypy",
    "pandas-stubs",
    "pre-commit",
    "pytest",
    "types-geopandas",
    "types-networkx",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-s -v -m 'not integration'"
markers = [
    "integration: tests requiring live GCS credentials; excluded by default (run with `-m integration`).",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
log_cli_level = "INFO"

[[tool.mypy.overrides]]
module = [
    "google",
    "google.*",
    "google.cloud",
    "google.cloud.storage",
    "google.cloud.storage.*",
    "rasterio",
    "rasterio.*",
]
ignore_missing_imports = true
follow_imports = "skip"
implicit_reexport = true

[tool.importlinter]
root_package = "jdluc"

[[tool.importlinter.contracts]]
name = "ETL"
type = "layers"
layers = [
    "jdluc.emissions_factors",
    "jdluc.attribution",
    "jdluc.emissions",
    "jdluc.harmonize",
    "jdluc.ingest",
]
